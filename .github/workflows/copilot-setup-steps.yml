# GitHub Copilot Coding Agent セットアップステップ
#
# Copilot coding agent がビルド環境で実行する初期化ステップを定義します。
# ジョブ名は `copilot-setup-steps` である必要があります。
# 手動実行（workflow_dispatch）または本ファイルの変更時に実行して、セットアップ内容を事前に検証できます。

name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js のセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 生成画像やスクリーンショットで日本語が文字化けしないよう、CJK フォントのみ導入する
      - name: 日本語フォントのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f

      - name: サイトの検証
        run: node scripts/check-site.mjs site
