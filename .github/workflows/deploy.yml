# GitHub Pages デプロイワークフロー
#
# main ブランチへのプッシュ時に `site/` 配下の静的ファイルを gh-pages ブランチへデプロイします。
# ビルド工程はなく、`site/` の内容をそのまま公開します。
#
# 初回のみ、リポジトリの Settings → Pages で
# 「Deploy from a branch」→ ブランチ `gh-pages` / フォルダ `/ (root)` を選択してください。

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: GitHub Pages へのデプロイ
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # PR プレビュー（pr-*）を消さないよう既存ファイルを保持する
          keep_files: true
          exclude_assets: 'pr-*'
