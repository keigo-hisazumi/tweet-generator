# CI ワークフロー
#
# 本リポジトリは `site/` 配下の静的ファイルをそのまま公開する構成で、ビルド工程・npm 依存はありません。
# そのため、外部依存なしで実行できるサイト検証（参照ファイルの存在確認・JavaScript の構文チェック）を行います。
# 検証内容は `scripts/check-site.mjs` を参照してください（ローカルでも `node scripts/check-site.mjs` で実行可能）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-site:
    name: サイト検証
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js のセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: サイトの検証
        run: node scripts/check-site.mjs site
      - name: シェルスクリプトの検証
        run: shellcheck scripts/*.sh
