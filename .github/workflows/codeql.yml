# CodeQL によるセキュリティスキャン
#
# - javascript-typescript: `site/` 配下の JavaScript を解析（ビルド不要のため build-mode: none）
# - actions: `.github/workflows/` 配下のワークフロー定義を解析（権限過多・スクリプトインジェクションなど）

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 18 * * 0" # 毎週月曜 03:17（JST）
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: CodeQL を初期化
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: 解析を実行
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
