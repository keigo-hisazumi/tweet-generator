# PR プレビューワークフロー
#
# PR ごとに gh-pages ブランチの `pr-<PR番号>/` へプレビュー環境をデプロイし、
# PR コメントにプレビュー URL と QR コードを自動投稿します。
# PR クローズ時はプレビューディレクトリを自動削除します。
#
# ビルド工程はなく、`site/` 配下の静的ファイルをそのまま公開します。
# （サイト内の参照はすべて相対パスのため、サブディレクトリ配信でも動作します）
#
# 以下の PR では GITHUB_TOKEN が読み取り専用になり gh-pages へ書き込めないため、プレビューをスキップします。
#   - fork からの PR
#   - Dependabot が作成した PR

name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: gh-pages への PR プレビューのデプロイ
        run: |
          scripts/publish-gh-pages.sh deploy site "pr-${PR_NUMBER}" "preview: PR #${PR_NUMBER} (${HEAD_SHA})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: プレビュー URL のコメント投稿
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const prNumber = context.issue.number;
            const { owner, repo } = context.repo;
            const previewUrl = `https://${owner.toLowerCase()}.github.io/${repo}/pr-${prNumber}/`;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(previewUrl)}`;
            const marker = '<!-- pr-preview -->';
            const body = [
              marker,
              '## プレビュー環境 🚀',
              '',
              `| | |`,
              `|---|---|`,
              `| **プレビューURL** | [${previewUrl}](${previewUrl}) |`,
              `| **コミット** | \`${process.env.HEAD_SHA.slice(0, 7)}\` |`,
              `| **QRコード** | ![](${qrUrl}) |`,
              '',
              '*コードをプッシュするたびに自動更新されます。GitHub Pages への反映には 1〜2 分かかることがあります。*',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

  cleanup-preview:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: gh-pages からプレビューディレクトリを削除
        run: |
          scripts/publish-gh-pages.sh remove "pr-${PR_NUMBER}" "chore: PR #${PR_NUMBER} のプレビューを削除"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
