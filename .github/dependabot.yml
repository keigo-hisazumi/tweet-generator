# Dependabot 設定
#
# 本リポジトリは npm などのパッケージ依存を持たない静的サイトのため、
# GitHub Actions の更新のみを対象にしています。
# 更新はまとめて 1 つの PR にし、PR タイトルは Conventional Commits 形式（chore(deps): ...）になります。

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
